[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vamp-shodan-hunt"
version = "1.0"
description = "Shodan OSINT hunter for attack-surface mapping in authorized audits"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "VampSecure Studios", email = "contact@vampsecurestudios.com" }]
keywords = ["security", "pentest", "audit", "cybersecurity", "vampsecure", "shodan", "osint", "reconnaissance", "attack-surface"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "aiohttp>=3.9.0",
    "rich>=13.7.0",
]


[project.scripts]
vamp-shodan-hunt = "vamp_shodan_hunt:main"

[project.urls]
Homepage = "https://github.com/Vampsecure-Labs/vamp-shodan-hunt"
Repository = "https://github.com/Vampsecure-Labs/vamp-shodan-hunt"

[tool.setuptools]
py-modules = ["vamp_shodan_hunt", "vampsec_report"]
